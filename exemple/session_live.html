<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Session Live - VALORANT Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111d;
      --panel: rgba(15, 23, 42, 0.92);
      --panel-2: rgba(30, 41, 59, 0.85);
      --text: #f8fafc;
      --muted: #94a3b8;
      --cyan: #00f0ff;
      --red: #ff4655;
      --green: #00e676;
      --gold: #fbbf24;
      --border: rgba(255,255,255,0.12);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Outfit', sans-serif;
      background: radial-gradient(circle at top, rgba(0,240,255,0.14), transparent 30%), var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      gap: 16px;
      flex-wrap: wrap;
    }

    .title-group h1 {
      margin: 0 0 6px;
      font-size: 1.8rem;
      letter-spacing: 0.04em;
    }

    .title-group p {
      margin: 0;
      color: var(--muted);
    }

    .btn-back {
      background: linear-gradient(135deg, var(--cyan), #0ea5e9);
      color: #07111d;
      border: none;
      border-radius: 999px;
      padding: 10px 16px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .hero {
      background: linear-gradient(135deg, rgba(0,240,255,0.14), rgba(255,70,85,0.14));
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      box-shadow: 0 16px 50px rgba(0,0,0,.25);
      margin-bottom: 24px;
    }

    .hero .player {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .hero .avatar {
      width: 84px;
      height: 84px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,.15);
      object-fit: cover;
      background: rgba(255,255,255,.08);
    }

    .hero h2 { margin: 0 0 4px; font-size: 1.5rem; }
    .hero .rank { color: var(--cyan); font-weight: 700; }
    .hero .sub { color: var(--muted); margin-top: 4px; }

    .hero .right {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: center;
    }

    .pill {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px;
      padding: 8px 12px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      position: relative;
      min-height: 130px;
    }

    .card .label {
      color: var(--muted);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .card .value {
      font-size: 1.8rem;
      font-weight: 800;
      margin-top: 8px;
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .delta {
      font-size: 0.95rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
    }

    .delta.positive { color: var(--green); }
    .delta.negative { color: var(--red); }
    .delta.neutral { color: var(--gold); }

    .card .footer {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 16px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
    }

    .panel h3 { margin: 0 0 12px; font-size: 1.1rem; }

    .list { display: grid; gap: 10px; }
    .list-item {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--panel-2);
      color: var(--muted);
    }
    .list-item strong { color: var(--text); }

    @media (max-width: 900px) {
      .detail-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="title-group">
        <h1>Session Live</h1>
        <p>Vue condensée de ta progression et de la dernière partie jouée.</p>
      </div>
      <a class="btn-back" href="index.html">← Retour au tracker</a>
    </div>

    <section class="hero">
      <div class="player">
        <img id="avatar" class="avatar" alt="avatar" />
        <div>
          <h2 id="player-name">Chargement…</h2>
          <div id="rank-text" class="rank">-</div>
          <div id="subtitle" class="sub">-</div>
        </div>
      </div>
      <div class="right">
        <div class="pill" id="refresh-counter">Refresh dans 10s</div>
        <div class="pill" id="last-match-label">Dernière partie : -</div>
        <div class="pill" id="source-label">Source : -</div>
      </div>
    </section>

    <section class="metrics-grid" id="metrics-grid"></section>

    <section class="detail-grid">
      <div class="panel">
        <h3>Détails de la dernière partie</h3>
        <div id="last-match-details" class="list"></div>
      </div>
      <div class="panel">
        <h3>Résumé de session</h3>
        <div id="session-summary" class="list"></div>
      </div>
    </section>
  </div>

  <script>
    const storageKey = 'tracker_valo_live_session_profile';

    function formatNumber(value, decimals = 3) {
      const num = Number(value);
      if (!Number.isFinite(num)) return '0';
      return num.toFixed(decimals).replace(/(\.\d*?[1-9])0+$|\.0+$/, '$1');
    }

    function formatDisplayValue(value) {
      if (typeof value === 'number') return formatNumber(value);
      if (typeof value === 'string' && /^-?\d+(\.\d+)?$/.test(value.trim())) {
        return formatNumber(value);
      }
      return value;
    }

    function formatDelta(value, decimals = 3) {
      const safe = Number(value);
      if (!Number.isFinite(safe) || safe <= 0) return { text: '0', cls: 'neutral' };
      return { text: `+${formatNumber(safe, decimals)}`, cls: 'positive' };
    }

    function getProfile() {
      try {
        const raw = localStorage.getItem(storageKey);
        if (raw) {
          return JSON.parse(raw);
        }
      } catch (e) {}

      return null;
    }

    function render(profile) {
      document.getElementById('player-name').textContent = `${profile.name}#${profile.tag}`;
      document.getElementById('rank-text').textContent = `${profile.rank?.name || '-'} • ${profile.region || 'EU'}`;
      document.getElementById('subtitle').textContent = profile.subtitle || 'Session Live';
      document.getElementById('avatar').src = profile.avatar || '';
      document.getElementById('source-label').textContent = `Source : ${profile.dataSource || 'Inconnue'}`;

      const matches = Array.isArray(profile.matches) ? profile.matches : [];
      const latest = matches[0] || {};
      const stats = profile.stats || {};

      document.getElementById('last-match-label').textContent = `Dernière partie : ${latest.map || '-'} • ${latest.result || '-'}`;

      const cards = [
        { label: 'Kills total', value: stats.kills ?? 0, deltaValue: latest.kills ?? 0, footer: `Dernier match : ${latest.kills ?? 0}` },
        { label: 'Deaths total', value: stats.deaths ?? 0, deltaValue: latest.deaths ?? 0, footer: `Dernier match : ${latest.deaths ?? 0}` },
        { label: 'Assists total', value: stats.assists ?? 0, deltaValue: latest.assists ?? 0, footer: `Dernier match : ${latest.assists ?? 0}` },
        { label: 'K/D', value: stats.kd ?? '0.000', deltaValue: latest.deaths ? (latest.kills || 0) / latest.deaths : 0, footer: `Dernier match : ${latest.kda || '-'}` },
        { label: 'Winrate', value: stats.winRate ?? '0%', deltaValue: latest.result === 'WIN' ? 1 : 0, footer: `${stats.wins ?? 0}V - ${stats.losses ?? 0}D` },
        { label: 'ACS', value: stats.acs ?? latest.acs ?? 0, deltaValue: latest.acs ?? 0, footer: `Dernier match : ${latest.acs ?? 0}` },
        { label: 'ADR', value: stats.adr ?? latest.adr ?? 0, deltaValue: latest.adr ?? 0, footer: `Dernier match : ${latest.adr ?? 0}` },
        { label: 'Matchs', value: stats.matches ?? matches.length ?? 0, deltaValue: 0, footer: `Dernier RR : ${latest.rrChange || '-'}` }
      ];

      const grid = document.getElementById('metrics-grid');
      grid.innerHTML = cards.map(card => {
        const delta = formatDelta(card.deltaValue);
        const displayValue = formatDisplayValue(card.value);
        return `
          <div class="card">
            <div class="label">${card.label}</div>
            <div class="value">
              <span>${displayValue}</span>
              <span class="delta ${delta.cls}">${delta.text}</span>
            </div>
            <div class="footer">${card.footer}</div>
          </div>
        `;
      }).join('');

      document.getElementById('last-match-details').innerHTML = [
        { label: 'Map', value: latest.map || '-' },
        { label: 'Résultat', value: latest.result || '-' },
        { label: 'Score', value: latest.score || '-' },
        { label: 'K / D / A', value: latest.kda || '-' },
        { label: 'ACS', value: latest.acs || '-' },
        { label: 'RR', value: latest.rrChange || '-' }
      ].map(item => `<div class="list-item"><span>${item.label}</span><strong>${item.value}</strong></div>`).join('');

      document.getElementById('session-summary').innerHTML = [
        { label: 'Total de matchs', value: `${stats.matches ?? matches.length ?? 0}` },
        { label: 'Victoires', value: `${stats.wins ?? 0}` },
        { label: 'Défaites', value: `${stats.losses ?? 0}` },
        { label: 'Taux de victoire', value: stats.winRate || '0%' },
        { label: 'K/D global', value: stats.kd || '0.00' },
        { label: 'ADR global', value: stats.adr || '0' }
      ].map(item => `<div class="list-item"><span>${item.label}</span><strong>${item.value}</strong></div>`).join('');
    }

    let refreshCountdown = 10;

    function updateRefreshCounter() {
      const el = document.getElementById('refresh-counter');
      if (el) {
        el.textContent = `Refresh dans ${refreshCountdown}s`;
      }
    }

    function resetRefreshCounter() {
      refreshCountdown = 10;
      updateRefreshCounter();
    }

    function refreshFromStorage() {
      const profile = getProfile();
      if (profile) {
        render(profile);
      }
      resetRefreshCounter();
    }

    document.addEventListener('DOMContentLoaded', () => {
      refreshFromStorage();
      window.addEventListener('storage', refreshFromStorage);
      setInterval(() => {
        refreshCountdown = Math.max(0, refreshCountdown - 1);
        if (refreshCountdown === 0) {
          refreshFromStorage();
        } else {
          updateRefreshCounter();
        }
      }, 1000);
    });
  </script>
</body>
</html>
